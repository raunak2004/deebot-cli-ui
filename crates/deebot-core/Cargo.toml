[package]
name = "deebot-core"
version = "0.1.0"
edition = "2021"
description = "Ecovacs cloud login and robot commands shared by deebot-cli and deebot-ui"

[features]
# Lets the CLI use the core enums as command-line values
clap = ["dep:clap"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
dirs = "5"
lzma-rs = "0.3.0"
md-5 = "0.11.0"
rsa = { version = "0.9.10", features = ["getrandom"] }
ruzstd = "0.9.1"
serde_json = "1"
tokio = { version = "1", features = ["time"] }

# Desktop uses the system TLS; Android has no system OpenSSL, so it bundles rustls instead
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
