[package]
name = "deebot-ui"
version = "0.1.0"
edition = "2021"
description = "Desktop and Android app for Ecovacs Deebot robots, built on deebot-core"

# Android loads the app as a shared library; the desktop binary links the same code
[lib]
name = "deebot_ui"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "deebot-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
deebot-core = { path = "../deebot-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.37.0"

# Android can't use eframe's default features: its accessibility support only works with
# GameActivity, and this app uses NativeActivity. So Android lists the features it needs.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity", "default_fonts", "wgpu"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "android-native-activity"] }

# Settings for cargo-apk, which packages the library into an .apk
[package.metadata.android]
package = "com.deebot.app"
apk_name = "deebot"
build_targets = ["aarch64-linux-android"]
# Launcher icons, drawn by tools/make_icons.py
resources = "android-res"
# Debug symbols make the library hundreds of megabytes; the app doesn't need them on a phone
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Deebot"
icon = "@mipmap/ic_launcher"

# The app only talks to the Ecovacs cloud, so internet is the one permission it needs
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
